<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./style.css">
    <title>Varehus Oversikt</title>
</head>
<body>
    <main class="container py-4">
        <header class="mb-4">
            <h1 id="overskrift">Varehus Oversikt</h1>
            <p class="lead text-center mb-0">Frontend hostet pa GitHub Pages, backend pa Render</p>
        </header>

        <div class="d-flex flex-wrap gap-2 justify-content-center mb-3">
            <button type="button" class="btn btn-dark" id="load-varelager">Last varelager</button>
            <button type="button" class="btn btn-outline-dark" id="load-ordrer">Last ordre</button>
        </div>
        <p id="api-base" class="text-center small text-muted mb-4"></p>

        <section class="mb-4">
            <h2 class="h4">Varelager</h2>
            <p id="vare-status" class="status-text">Ingen data lastet enna.</p>
            <div class="table-responsive">
                <table class="table table-striped table-sm align-middle" id="vare-tabell">
                    <thead>
                        <tr>
                            <th>VNr</th>
                            <th>Betegnelse</th>
                            <th>Antall</th>
                            <th>Pris</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <section>
            <h2 class="h4">Ordreliste</h2>
            <p id="ordre-status" class="status-text">Ingen data lastet enna.</p>
            <div class="table-responsive">
                <table class="table table-striped table-sm align-middle" id="ordre-tabell">
                    <thead>
                        <tr>
                            <th>OrdreNr</th>
                            <th>OrdreDato</th>
                            <th>SendtDato</th>
                            <th>BetaltDato</th>
                            <th>KundeNr</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="./config.js"></script>
    <script src="./app.js"></script>
</body>
</html>
